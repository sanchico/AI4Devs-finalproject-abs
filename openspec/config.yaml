schema: spec-driven

context: |
  Proyecto de curso (pen2mermaid). Se evalúa también el proceso con el agente.
  Escribe los artefactos en español; mantén en inglés las palabras clave de
  OpenSpec (Requirement, Scenario, SHALL/MUST, WHEN/THEN).
  Invariantes que ningún cambio debe romper sin decidirlo explícitamente:
  - Reconocimiento de trazos local y determinista; sin IA por trazo.
  - Frontend en módulos ES sin build; dependencias solo por CDN.
  - Backend en Supabase (docs/PRD-MVP.md v0.7): sin servidor propio. PostgreSQL
    ordena y autoriza con la función apply_op; Realtime reparte las operaciones.
  - apply(op) existe solo en JavaScript (frontend/ops.js). El servidor no
    interpreta el grafo: todos los clientes aplican el mismo registro ordenado.
  - Last-writer-wins por campo en el orden del servidor; una operación sobre un
    elemento borrado se descarta igual en todos los clientes.
  - Seguridad: Mermaid con securityLevel 'strict'; RLS en todas las tablas y
    ninguna escritura directa (solo funciones security definer con search_path
    fijo); quien no es miembro recibe cero filas; claves de servicio fuera del repo.
  Fuera de alcance del MVP: tipos nuevos de diagrama, pan/zoom, cursores remotos,
  presencia, reconexión automática, instantáneas, Edge Functions, edición offline
  con fusión, historial, IA de visión, CI. El backend en Java
  (docs/PRD-backend-java.md) es una mejora para después de la entrega.

rules:
  proposal:
    - Indica a qué bloque del PRD (F3..F5, S1..S3, D1, P2) e historia (HU-01..03) corresponde
    - Di explícitamente qué queda fuera y si choca con el "fuera de alcance" del MVP
  design:
    - Registra cada decisión con las alternativas descartadas y el motivo
    - Si afecta a operaciones, describe el impacto en ops.js y en apply_op
  tasks:
    - Tareas que quepan en una sesión de 2-3 h, con estimación en horas
    - Incluye los tests (node --test, también los de supabase/tests) como tareas, no como nota final

operations:
  apply:
    guidance:
      - Commits pequeños y en español usando conventional commits
      - Al cerrar, actualiza CLAUDE.md si cambia la estructura o cómo arrancar/testear
  archive:
    guidance:
      - Añade la entrada de la sesión en docs/bitacora.md con los prompts literales
      - Revisa si hay que actualizar alguna sección del readme (2.x, 3, 4)

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
