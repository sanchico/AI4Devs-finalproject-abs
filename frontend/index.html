<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pen2mermaid</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b2b2b'/%3E%3Cg transform='rotate(45 16 16)'%3E%3Crect x='13' y='3' width='6' height='3' rx='1' fill='%23e8788a'/%3E%3Crect x='13' y='6' width='6' height='14' fill='%23f5b82e'/%3E%3Cpolygon points='13,20 19,20 16,27' fill='%23f1d9b5'/%3E%3Cpolygon points='14.7,24.5 17.3,24.5 16,27' fill='%23333'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bar">
  <h1 title="Dibuja a mano, colabora y obtén Mermaid">pen2mermaid</h1>
  <label>Diagrama
    <select id="kind">
      <option value="flow">Flujo</option>
      <option value="state">Estados (UML)</option>
    </select>
  </label>
  <label>Dirección
    <select id="dir"><option value="TD">Arriba → abajo</option><option value="LR">Izquierda → derecha</option></select>
  </label>
  <button class="btn" id="mode" title="Solo afecta al ratón: con lápiz siempre se dibuja y con el dedo siempre se mueve">Ratón: dibuja</button>
  <span class="spacer"></span>
  <button class="btn" id="undo">Deshacer</button>
  <button class="btn" id="clear">Limpiar</button>
</div>

<div class="main">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="legend" id="legend"></div>
    <div class="toast" id="toast"></div>
    <div class="editor" id="editor">
      <input id="editInput" type="text" aria-label="Etiqueta">
      <button class="btn" id="editOk">OK</button>
      <button class="btn" id="editDel" title="Borrar elemento">🗑</button>
    </div>
  </div>
  <div class="side">
    <div class="tabs">
      <button class="on" id="tabPrev">Vista previa</button>
      <button id="tabCode">Código Mermaid</button>
    </div>
    <div class="pane" id="preview"></div>
    <div class="pane" id="codePane" hidden><pre id="code"></pre></div>
    <div class="side-foot">
      <button class="btn" id="copy">Copiar código</button>
      <span id="stats"></span>
    </div>
  </div>
</div>

<!-- Al cambiar de versión de Mermaid hay que cambiar también el hash `integrity` (API de cdnjs: https://api.cdnjs.com/libraries/mermaid/<versión>?fields=sri) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.8/mermaid.min.js"
        integrity="sha512-W44v4BgrfdCXnfKNCPLIa8yzpMbB5761jGLoi9UKSkAP5rveS4LqWnnBQV4n7hArLoGHijukXIpCxxbzqAX/Vg=="
        crossorigin="anonymous"></script>
<script type="module" src="main.js"></script>
</body>
</html>
